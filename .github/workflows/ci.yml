name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时只运行 CI 检查"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: 解析版本
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}
      build_version: ${{ steps.build_version.outputs.build_version }}
    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 校验发布版本
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "stcjudge") | .version'
          )"
          expected_tag="v$package_version"

          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "tag $TAG_NAME 与包版本 $package_version 不一致, 期望 $expected_tag" >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: 解析构建版本
        id: build_version
        env:
          IS_RELEASE: ${{ steps.release_context.outputs.is_release }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "build_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build_version=$(bash scripts/build-version.sh)" >> "$GITHUB_OUTPUT"

  test:
    name: 单元测试
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Linux 构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            pkg-config

      - name: 恢复 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64

      - name: 运行测试
        shell: bash
        env:
          PROJECT_BUILD_VERSION: v${{ needs.version.outputs.build_version }}
        run: |
          set -euo pipefail
          cargo test --locked --release --workspace

  build:
    name: 构建 ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_os: linux
            package_arch: x86_64
            dist_script: dist-linux.sh
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_os: linux
            package_arch: aarch64
            dist_script: dist-linux.sh
          - label: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            package_os: macos
            package_arch: x86_64
            dist_script: dist-macos.sh
          - label: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            package_os: macos
            package_arch: aarch64
            dist_script: dist-macos.sh
          - label: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package_os: windows
            package_arch: x86_64
            dist_script: dist-windows.ps1
          - label: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package_os: windows
            package_arch: aarch64
            dist_script: dist-windows.ps1
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add ${{ matrix.target }}

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            pkg-config

      - name: 恢复 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: 生成发布产物
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROJECT_BUILD_VERSION: v${{ needs.version.outputs.build_version }}
          PROJECT_DIST_TARGET: ${{ matrix.target }}
          PROJECT_DIST_OUT: release-artifacts
        run: ./scripts/${{ matrix.dist_script }}

      - name: 生成发布产物
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROJECT_BUILD_VERSION: v${{ needs.version.outputs.build_version }}
          PROJECT_DIST_TARGET: ${{ matrix.target }}
          PROJECT_DIST_OUT: release-artifacts
        run: ./scripts/dist-windows.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: stcjudge-${{ needs.version.outputs.build_version }}-${{ matrix.package_os }}-${{ matrix.package_arch }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  judges:
    name: 打包评测脚本
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 打包评测脚本
        shell: bash
        run: |
          set -euo pipefail
          first_script="$(find samples -path "*/judge/*.rhai" -type f -print -quit)"
          if [ -z "$first_script" ]; then
            echo "没有找到评测脚本" >&2
            exit 1
          fi
          find samples -path "*/judge/*.rhai" -type f -print0 | sort -z | xargs -0 zip judges.zip

      - name: 上传评测脚本
        uses: actions/upload-artifact@v7
        with:
          name: judges
          path: judges.zip
          if-no-files-found: error

  release:
    name: 发布 release
    if: needs.version.outputs.is_release == 'true'
    needs:
      - version
      - test
      - build
      - judges
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布 tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi

          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md

          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(stcjudge-*.tar.gz stcjudge-*.zip stcjudge-*.dmg)

          if (( ${#archives[@]} != 12 )); then
            echo "预期 12 个归档, 实际找到 ${#archives[@]} 个" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

          sha256sum "${archives[@]}" > SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/stcjudge-*.tar.gz
            release-artifacts/stcjudge-*.zip
            release-artifacts/stcjudge-*.dmg
            release-artifacts/SHA256SUMS
            release-artifacts/judges.zip
          )

          if (( ${#assets[@]} != 14 )); then
            echo "预期 14 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "stcjudge v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "stcjudge v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
